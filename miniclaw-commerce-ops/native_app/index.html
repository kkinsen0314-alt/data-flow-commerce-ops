<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%data-flow-mark.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#142321" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Data Flow" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="format-detection" content="email=no" />
    <script>
      window.__authPrewarm = fetch('%BASE_URL%api/auth/me', {
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
      }).catch(function () {
        return null;
      });
    </script>
    <title>Data Flow</title>
  </head>
  <body>
    <script>
      (function () {
        var root = document.documentElement;
        var theme = localStorage.getItem('miniclaw-theme');
        if (
          theme === 'dark' ||
          (theme === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          root.classList.add('dark');
        }
        var scheme = localStorage.getItem('miniclaw-color-scheme');
        if (scheme === 'orange') root.classList.add('theme-orange');
        if (scheme === 'neutral') root.classList.add('theme-neutral');
        if (localStorage.getItem('miniclaw-font-style') === 'anthropic') {
          root.classList.add('font-anthropic');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
